[package]
name = "hayulo-lang"
version = "2.0.0-alpha.0"
edition = "2024"
description = "Hayulo language toolchain rewritten in Rust."
license = "MIT"

[[bin]]
name = "hayulo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.38", features = ["derive"] }
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
walkdir = "2.5.0"
